<svg xmlns="http://www.w3.org/2000/svg" width="412" height="232" viewBox="0 0 412 232" role="img" aria-label="hello world"><title>hello world</title><style>text{font-family:G,R,'Google Sans','Segoe UI',Roboto,sans-serif;font-variation-settings:'ROND' 100}
.up{animation:up .8s cubic-bezier(.05,.7,.1,1) both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.34,1.56,.64,1) both}
.fade{animation:fade .9s ease both}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
.spin-r{transform-box:fill-box;transform-origin:center;animation:spin 28s linear infinite reverse}
.bob{transform-box:fill-box;transform-origin:center;animation:bob 7s ease-in-out infinite}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,0,0,1) both}
.wght{animation:wght 1.6s cubic-bezier(.2,0,0,1) .2s both}
.wave{animation:wave 2.4s linear infinite}
.blink{animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(12deg)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes wght{from{font-variation-settings:'ROND' 100,'wght' 400}to{font-variation-settings:'ROND' 100,'wght' 760}}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-48px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}.code text{font-family:monospace}</style><rect width="412" height="232" rx="28" fill="#e8e8e8"/><g class="code up" style="animation-delay:0.08s" font-size="12"><text x="20" y="44" fill="#b0b0b0">1</text><text x="44" y="44" xml:space="preserve"><tspan fill="#474747">#include </tspan><tspan fill="#474747">&lt;iostream&gt;</tspan></text><text x="20" y="66" fill="#b0b0b0">2</text><text x="44" y="66" xml:space="preserve"><tspan fill="#474747">using namespace </tspan><tspan fill="#1b1b1b">std</tspan><tspan fill="#9a9a9a">;</tspan></text><text x="20" y="88" fill="#b0b0b0">3</text><text x="44" y="88" xml:space="preserve"><tspan fill="#474747">int </tspan><tspan fill="#1b1b1b">main</tspan><tspan fill="#9a9a9a">()</tspan></text><text x="20" y="110" fill="#b0b0b0">4</text><text x="44" y="110" xml:space="preserve"><tspan fill="#9a9a9a">{</tspan></text><text x="20" y="132" fill="#b0b0b0">5</text><text x="44" y="132" xml:space="preserve"><tspan fill="#1b1b1b">    </tspan><tspan fill="#1b1b1b">cout</tspan><tspan fill="#9a9a9a"> &lt;&lt; </tspan><tspan fill="#474747">"hello world"</tspan><tspan fill="#9a9a9a"> &lt;&lt; </tspan><tspan fill="#1b1b1b">endl</tspan><tspan fill="#9a9a9a">;</tspan></text><text x="20" y="154" fill="#b0b0b0">6</text><text x="44" y="154" xml:space="preserve"><tspan fill="#1b1b1b">    </tspan><tspan fill="#1b1b1b">cout</tspan><tspan fill="#9a9a9a"> &lt;&lt; </tspan><tspan fill="#474747">"I'm Ryne"</tspan><tspan fill="#9a9a9a"> &lt;&lt; </tspan><tspan fill="#1b1b1b">endl</tspan><tspan fill="#9a9a9a">;</tspan></text><text x="20" y="176" fill="#b0b0b0">7</text><text x="44" y="176" xml:space="preserve"><tspan fill="#1b1b1b">    </tspan><tspan fill="#1b1b1b">cout</tspan><tspan fill="#9a9a9a"> &lt;&lt; </tspan><tspan fill="#474747">"here's some of my projects"</tspan><tspan fill="#9a9a9a"> &lt;&lt; </tspan><tspan fill="#1b1b1b">endl</tspan><tspan fill="#9a9a9a">;</tspan></text><text x="20" y="198" fill="#b0b0b0">8</text><text x="44" y="198" xml:space="preserve"><tspan fill="#9a9a9a">}</tspan></text></g></svg>