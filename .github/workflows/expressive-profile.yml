name: Expressive Profile

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths:
      - profile.json
      - .profile/icons.json
      - .github/workflows/expressive-profile.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: metawka/expressive-profile
          ref: v1
          path: .expressive-profile

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Render
        run: node .expressive-profile/action/render.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}

      - name: Apply pixel art
        run: python3 scripts/apply-pixel.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets static README.md .profile
          git diff --cached --quiet || (git commit -m "Updated profile" && git push)
