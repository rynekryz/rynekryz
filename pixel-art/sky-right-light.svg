<svg xmlns="http://www.w3.org/2000/svg" width="260" height="256" viewBox="0 0 260 256" shape-rendering="crispEdges" role="img" aria-label="pixel sky"><title>pixel sky</title><style>
.px{fill:#1b1b1b}
.soft{fill:#1b1b1b;fill-opacity:.35}
.rock{transform-box:fill-box;transform-origin:center;animation:rock 5s steps(4,end) infinite}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 2.4s steps(3,end) infinite}
.dot{transform-box:fill-box;transform-origin:center;animation:pd 3s steps(2,end) infinite}
@keyframes rock{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes tw{0%,100%{transform:scale(.5) rotate(0deg);opacity:.3}50%{transform:scale(1) rotate(45deg);opacity:1}}
@keyframes pd{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
