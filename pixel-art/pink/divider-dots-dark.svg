<svg xmlns="http://www.w3.org/2000/svg" width="840" height="24" viewBox="0 0 840 24" shape-rendering="crispEdges" role="img" aria-label="pixel divider"><title>pixel divider</title><style>
.px{fill:#ffd2dc}
.dot{transform-box:fill-box;transform-origin:center;animation:dot 1.5s steps(3,end) infinite}
